name: Target Version Gate

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  target-version-contract:
    name: Target Version Contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default-branch policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Read changed paths without checking out PR code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed_files_b64="$(
            gh api \
              --paginate \
              --slurp \
              "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" |
              jq -c '[
                .[][] |
                (
                  if .status == "renamed" then
                    .previous_filename, .filename
                  else
                    .filename
                  end
                ) |
                select(type == "string" and length > 0)
              ]' |
              openssl base64 -A
          )"
          test -n "$changed_files_b64"
          echo "PR_CHANGED_FILES_B64=$changed_files_b64" >> "$GITHUB_ENV"

      - name: Validate target version, branch, base, and PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/validate_target_version_pr.py

  web-quality:
    name: Web Audit, Lint, and Build
    runs-on: ubuntu-latest
    steps:
      - id: scope
        name: Read changed paths from GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              },
            );
            const web = files.some((file) =>
              file.filename.startsWith("web/") ||
              (file.status === "renamed" && file.previous_filename.startsWith("web/")),
            );
            core.setOutput("web", web);
      - if: steps.scope.outputs.web != 'true'
        run: echo "No Web changes detected"
      - if: steps.scope.outputs.web == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - if: steps.scope.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.scope.outputs.web == 'true'
        working-directory: web
        run: npm ci
      - if: steps.scope.outputs.web == 'true'
        working-directory: web
        run: npm audit --audit-level=high
      - if: steps.scope.outputs.web == 'true'
        working-directory: web
        run: npm run lint
      - if: steps.scope.outputs.web == 'true'
        working-directory: web
        run: npm run build
