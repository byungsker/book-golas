name: Deploy Edge Functions

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
      function_name:
        description: 'Function name (leave empty for all)'
        required: false
        default: ''
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce development-only manual dispatch
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" != "dev" ]]; then
            echo "::error::Manual Edge deployment only permits target=dev."
            exit 1
          fi
          if [[ "$REF" != "refs/heads/dev" ]]; then
            echo "::error::Manual Edge deployment must run from refs/heads/dev."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Project
        run: |
          echo "Linking to Dev..."
          supabase link --project-ref "$SUPABASE_PROJECT_REF_DEV"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF_DEV: ${{ secrets.SUPABASE_PROJECT_REF_DEV }}

      - name: Configure Edge Function Secrets
        run: |
          REVENUECAT_WEBHOOK_AUTH_KEY="$REVENUECAT_WEBHOOK_AUTH_KEY_DEV"
          test -n "$REVENUECAT_WEBHOOK_AUTH_KEY"
          test -n "$ALADIN_TTB_KEY"
          test -n "$GOOGLE_CLOUD_VISION_API_KEY"
          supabase secrets set \
            REVENUECAT_WEBHOOK_AUTH_KEY="$REVENUECAT_WEBHOOK_AUTH_KEY" \
            ALADIN_TTB_KEY="$ALADIN_TTB_KEY" \
            GOOGLE_CLOUD_VISION_API_KEY="$GOOGLE_CLOUD_VISION_API_KEY"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REVENUECAT_WEBHOOK_AUTH_KEY_DEV: ${{ secrets.REVENUECAT_WEBHOOK_AUTH_KEY_DEV }}
          ALADIN_TTB_KEY: ${{ secrets.ALADIN_TTB_KEY }}
          GOOGLE_CLOUD_VISION_API_KEY: ${{ secrets.GOOGLE_CLOUD_VISION_API_KEY }}

      - name: Deploy Edge Functions
        run: |
          FUNCTION="${{ inputs.function_name }}"

          if [ -n "$FUNCTION" ]; then
            echo "Deploying single function: $FUNCTION to dev"
            supabase functions deploy "$FUNCTION"
          else
            echo "Deploying all functions to dev..."
            for fn in supabase/functions/*/; do
              fn_name=$(basename "$fn")
              [ ! -f "$fn/index.ts" ] && echo "  Skipping: $fn_name (no index.ts)" && continue
              echo "  Deploying: $fn_name"
              supabase functions deploy "$fn_name"
            done
          fi
          echo "✅ Deployment complete"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
