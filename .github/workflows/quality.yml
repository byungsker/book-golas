name: Quality Gates

on:
  pull_request:
    branches:
      - main
      - dev
      - 'daily/**'

concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Resolve Quality Scope
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.scope.outputs.web }}
    steps:
      - id: scope
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              },
            );
            const changed = files.some((file) =>
              file.filename.startsWith("web/") ||
              (file.status === "renamed" && file.previous_filename.startsWith("web/")),
            );
            core.setOutput("web", changed);

  flutter:
    name: Flutter Analyze and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Create test environment
        run: |
          printf '%s\n' \
            'ALADIN_TTB_KEY=test' \
            'SUPABASE_URL_DEV=https://example.supabase.co' \
            'SUPABASE_ANON_KEY_DEV=test' \
            'SUPABASE_URL_PROD=https://example.supabase.co' \
            'SUPABASE_ANON_KEY_PROD=test' \
            'GOOGLE_CLOUD_VISION_API_KEY=test' \
            'REVENUECAT_PUBLIC_KEY=test' \
            'ENVIRONMENT=development' > .env
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --no-pub

  web:
    name: Web Audit, Lint, and Build
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - if: needs.changes.outputs.web != 'true'
        working-directory: .
        run: echo "No Web changes detected"
      - if: needs.changes.outputs.web == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: needs.changes.outputs.web == 'true'
        run: npm ci
      - if: needs.changes.outputs.web == 'true'
        run: npm audit --audit-level=high
      - if: needs.changes.outputs.web == 'true'
        run: npm run lint
      - if: needs.changes.outputs.web == 'true'
        run: npm run build

  edge-functions:
    name: Edge Function Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check all functions
        run: |
          while IFS= read -r entry; do
            config="$(dirname "$entry")/deno.json"
            if [ ! -f "$config" ]; then
              config="supabase/functions/deno.json"
            fi
            deno check --config "$config" "$entry"
          done < <(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts | sort)
