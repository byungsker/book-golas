name: Quality Gates

on:
  pull_request:
    branches:
      - main
      - dev
      - 'daily/**'
  push:
    branches:
      - 'codex/**'
      - 'version/**'
      - 'release/**'
      - 'hotfix/**'

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter Analyze and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Create test environment
        run: |
          printf '%s\n' \
            'ALADIN_TTB_KEY=test' \
            'SUPABASE_URL_DEV=https://example.supabase.co' \
            'SUPABASE_ANON_KEY_DEV=test' \
            'SUPABASE_URL_PROD=https://example.supabase.co' \
            'SUPABASE_ANON_KEY_PROD=test' \
            'GOOGLE_CLOUD_VISION_API_KEY=test' \
            'REVENUECAT_PUBLIC_KEY=test' \
            'ENVIRONMENT=development' > .env
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --no-pub

  web:
    name: Web Audit, Lint, and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - if: ${{ !contains(github.head_ref || github.ref_name, '/web/') }}
        working-directory: .
        run: echo "Web quality is not applicable to this delivery unit"
      - if: ${{ contains(github.head_ref || github.ref_name, '/web/') }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: ${{ contains(github.head_ref || github.ref_name, '/web/') }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: ${{ contains(github.head_ref || github.ref_name, '/web/') }}
        run: npm ci
      - if: ${{ contains(github.head_ref || github.ref_name, '/web/') }}
        run: npm audit --audit-level=high
      - if: ${{ contains(github.head_ref || github.ref_name, '/web/') }}
        run: npm run lint
      - if: ${{ contains(github.head_ref || github.ref_name, '/web/') }}
        run: npm run build

  edge-functions:
    name: Edge Function Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check all functions
        run: |
          while IFS= read -r entry; do
            config="$(dirname "$entry")/deno.json"
            if [ ! -f "$config" ]; then
              config="supabase/functions/deno.json"
            fi
            deno check --config "$config" "$entry"
          done < <(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts | sort)
