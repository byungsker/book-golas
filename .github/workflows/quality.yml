name: Quality Gates

on:
  pull_request:
    branches:
      - main
      - dev
      - 'daily/**'
  push:
    branches:
      - 'codex/**'
      - 'version/**'
      - 'release/**'
      - 'hotfix/**'

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter Analyze and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Create test environment
        run: |
          printf '%s\n' \
            'ALADIN_TTB_KEY=test' \
            'SUPABASE_URL_DEV=https://example.supabase.co' \
            'SUPABASE_ANON_KEY_DEV=test' \
            'SUPABASE_URL_PROD=https://example.supabase.co' \
            'SUPABASE_ANON_KEY_PROD=test' \
            'GOOGLE_CLOUD_VISION_API_KEY=test' \
            'REVENUECAT_PUBLIC_KEY=test' \
            'ENVIRONMENT=development' > .env
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --no-pub

  web:
    name: Web Audit, Lint, and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - if: ${{ !(contains(github.head_ref || github.ref_name, '/web/') || contains(github.head_ref || github.ref_name, '/operations/')) }}
        working-directory: .
        run: echo "Web quality is not applicable to this delivery unit"
      - if: ${{ contains(github.head_ref || github.ref_name, '/web/') || contains(github.head_ref || github.ref_name, '/operations/') }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: ${{ contains(github.head_ref || github.ref_name, '/web/') || contains(github.head_ref || github.ref_name, '/operations/') }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: ${{ contains(github.head_ref || github.ref_name, '/web/') || contains(github.head_ref || github.ref_name, '/operations/') }}
        run: npm ci
      - if: ${{ contains(github.head_ref || github.ref_name, '/web/') }}
        run: npm audit --audit-level=high
      - if: ${{ contains(github.head_ref || github.ref_name, '/web/') || contains(github.head_ref || github.ref_name, '/operations/') }}
        run: npm run lint
      - if: ${{ contains(github.head_ref || github.ref_name, '/web/') || contains(github.head_ref || github.ref_name, '/operations/') }}
        run: npm run build

  agent-harness:
    name: Agent Harness Contract Tests
    if: contains(github.head_ref || github.ref_name, '/operations/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run harness tests
        env:
          HARNESS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HARNESS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 docs/agent-harness/ci_verify.py --base-sha "$HARNESS_BASE_SHA" --head-sha "$HARNESS_HEAD_SHA"
          python3 docs/agent-harness/test_validate.py
          python3 docs/agent-harness/test_run.py
          python3 docs/agent-harness/validate.py --state docs/agent-harness/task-state.example.json --events docs/agent-harness/events.example.jsonl
          python3 -m py_compile docs/agent-harness/*.py

  edge-functions:
    name: Edge Function Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify exact source head and baseline protection
        if: github.event_name == 'pull_request'
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          if git cat-file -e "$BASE_COMMIT:supabase/functions/llm-evals/fixtures.ts" 2>/dev/null; then
            git diff --quiet "$BASE_COMMIT" HEAD -- supabase/functions/llm-evals/contracts.ts supabase/functions/llm-evals/fixtures.ts
          fi
      - name: Check all functions
        run: |
          while IFS= read -r entry; do
            config="$(dirname "$entry")/deno.json"
            if [ ! -f "$config" ]; then
              config="supabase/functions/deno.json"
            fi
            deno check --config "$config" "$entry"
          done < <(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts | sort)
      - name: Verify authorization contracts
        run: deno test --allow-read supabase/functions/authorization-contract.test.ts
      - name: Run function tests
        run: |
          deno test --allow-net supabase/functions/send-batch-nudge/daily-reminder_test.ts supabase/functions/send-batch-nudge/deadline-reminder_test.ts
          deno test --config supabase/functions/reading-insights/deno.json --allow-env --allow-net supabase/functions/reading-insights/test.ts
          deno test --allow-read supabase/functions/generate-embedding/usage-log.test.ts
          deno test --allow-read supabase/functions/_shared/ai-cost-control.test.ts supabase/functions/_shared/ai-usage-contract.test.ts supabase/functions/ai-cost-control-contract.test.ts
          deno test --config supabase/functions/deno.json --allow-read supabase/functions/_shared/ai-usage.test.ts
          deno test --config supabase/functions/deno.json --allow-read supabase/functions/recommend-next-books/services/profile-collector.test.ts
          deno test --allow-read supabase/functions/_shared/edge-http.test.ts
          deno test --allow-read supabase/functions/send-batch-nudge/delivery-metrics.test.ts
      - name: Run deterministic LLM quality gate
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          deno test --allow-read supabase/functions/llm-evals/evaluator.test.ts
          deno run --allow-read supabase/functions/llm-evals/run.ts --commit "$SOURCE_COMMIT" --candidate synthetic > /tmp/bookgolas-llm-eval-report.json
          cat /tmp/bookgolas-llm-eval-report.json

  governance-contract:
    name: Governance Contract Tests
    if: contains(github.head_ref || github.ref_name, '/governance/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run target-version contract tests
        run: |
          if [ -f .github/scripts/test_validate_target_version_pr.py ]; then
            python3 .github/scripts/test_validate_target_version_pr.py
          else
            echo "Governance contract tests are not present on this source branch"
          fi
