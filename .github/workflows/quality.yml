name: Quality Gates

on:
  pull_request:
    branches:
      - main
      - dev
      - 'version/**'
      - 'release/**'

concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter Analyze and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Verify mobile client configuration boundary
        run: python3 tool/verify_mobile_client_config.py --self-test --source-root . --workflow ../.github/workflows/ios-testflight.yml --workflow ../.github/workflows/ios-production.yml
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --no-pub

  web:
    name: Web Audit, Lint, and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  edge-functions:
    name: Edge Function Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check all functions
        run: |
          while IFS= read -r entry; do
            config="$(dirname "$entry")/deno.json"
            if [ ! -f "$config" ]; then
              config="supabase/functions/deno.json"
            fi
            deno check --config "$config" "$entry"
          done < <(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts | sort)
