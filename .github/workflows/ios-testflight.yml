name: iOS TestFlight Deploy

on:
  pull_request:
    branches:
      - 'version/mobile/**'
    paths:
      - '.github/workflows/ios-testflight.yml'
      - 'supabase/functions/**'
  push:
    branches:
      - dev
      - 'version/mobile/**'
      - 'release/mobile/**'
    # web 전용 / 문서 전용 변경 시 iOS 빌드 트리거 안 함
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Deploy a new build or verify an existing TestFlight build'
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - verify
      marketing_version:
        description: 'Marketing version used by verify'
        required: true
        default: '1.0.2'
        type: string
      build_number:
        description: 'Build number used by verify'
        required: true
        default: '29501'
        type: string

jobs:
  edge-function-tests:
    name: Test Mobile Edge Functions
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate reproducible Edge Function dependencies
        run: |
          supabase/functions/deploy-with-retry_test.sh
          while IFS= read -r entry; do
            config="$(dirname "$entry")/deno.json"
            lockfile="$(dirname "$entry")/deno.lock"
            test -f "$config"
            test -f "$lockfile"
            deno check --frozen --config "$config" "$entry"
          done < <(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts | sort)
          if rg -n 'https://esm\.sh/' supabase/functions -g '*.ts'; then
            echo "::error::Edge Functions must not import esm.sh directly."
            exit 1
          fi

      - name: Test third-party AI provider boundaries
        run: |
          deno test --frozen --config supabase/functions/deno.json --allow-env --allow-net \
            supabase/functions/_shared/third-party-ai-consent.test.ts \
            supabase/functions/vision-ocr/index_test.ts
          deno test --frozen --config supabase/functions/structure-notes/deno.json --allow-env --allow-net \
            supabase/functions/structure-notes/services/chain-service.test.ts

  migrate-database:
    name: Apply Database Migrations (Dev)
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy') }}
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Link to Dev Project
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Repair migration history (orphan remote migrations)
        run: |
          echo "Marking orphan remote migrations as reverted (idempotent)..."
          supabase migration repair --status reverted 20260419123526 20260419130933 || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply Migrations
        run: |
          echo "Applying migrations to Dev database..."
          supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify Migration Status
        run: |
          echo "Checking migration status..."
          supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy-edge-functions:
    needs: migrate-database
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test third-party AI provider boundaries
        run: |
          deno test --config supabase/functions/deno.json --allow-env --allow-net \
            supabase/functions/_shared/third-party-ai-consent.test.ts \
            supabase/functions/vision-ocr/index_test.ts
          deno test --config supabase/functions/structure-notes/deno.json --allow-env --allow-net \
            supabase/functions/structure-notes/services/chain-service.test.ts

      - name: Deploy consent-gated Edge Functions to Dev
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
        run: |
          for function_name in \
            extract-keywords \
            generate-book-review \
            generate-embedding \
            reading-insights \
            recall-search \
            recommend-next-books \
            structure-notes \
            vision-ocr; do
            supabase/functions/deploy-with-retry.sh "$function_name" \
              --project-ref "$SUPABASE_PROJECT_REF"
          done

  build-and-deploy:
    needs: deploy-edge-functions
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy') }}
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Xcode 26 toolchain
        run: |
          DEVELOPER_PATH="/Applications/Xcode.app/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_PATH" >> "$GITHUB_ENV"
          sudo xcode-select -s "$DEVELOPER_PATH"

          XCODE_VERSION=$(xcodebuild -version | sed -n '1p')
          if ! echo "$XCODE_VERSION" | grep -q '^Xcode 26'; then
            echo "::error::Xcode 26+ is required for App Store Connect/TestFlight uploads. Found: $XCODE_VERSION"
            exit 1
          fi

          IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          IOS_SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          if ! echo "$IOS_SDK_VERSION" | grep -q '^26\.'; then
            echo "::error::The iOS 26 device SDK is required. Found: $IOS_SDK_VERSION"
            exit 1
          fi

          for header in \
            "$IOS_SDK_PATH/usr/include/sys/_types/_ssize_t.h" \
            "$IOS_SDK_PATH/usr/include/_modules/_darwin_c_stdio.h"; do
            if [ ! -f "$header" ]; then
              echo "::error::The selected iOS device SDK is incomplete: $header is missing."
              exit 1
            fi
          done

          xcodebuild -version
          echo "iOS device SDK: $IOS_SDK_VERSION ($IOS_SDK_PATH)"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'
          cache: true

      - name: Setup Ruby (Homebrew)
        run: |
          echo "/opt/homebrew/opt/ruby/bin" >> $GITHUB_PATH
          export PATH="/opt/homebrew/opt/ruby/bin:$PATH"
          ruby -v
          gem list bundler

      - name: Install Ruby dependencies
        run: |
          cd app/ios
          bundle config set --local path vendor/bundle
          bundle install

      - name: Test App Store Connect build verification
        run: ruby app/ios/fastlane/test/testflight_build_verifier_test.rb

      - name: Flutter pub get
        run: |
          cd app
          flutter pub get

      - name: Install CocoaPods
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          cd app/ios
          bundle exec pod install --repo-update

      - name: Install Certificate and Provisioning Profiles
        id: install-cert
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_DEV_BASE64 }}
          PROVISIONING_PROFILE_WIDGET_BASE64: ${{ secrets.PROVISIONING_PROFILE_WIDGET_DEV_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          PROVISIONING_PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          WIDGET_PROFILE_PATH=$RUNNER_TEMP/widget_profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode > $PROVISIONING_PROFILE_PATH
          echo -n "$PROVISIONING_PROFILE_WIDGET_BASE64" | base64 --decode > $WIDGET_PROFILE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain-db

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          PROFILE_PLIST=$(/usr/bin/security cms -D -i $PROVISIONING_PROFILE_PATH)
          PROFILE_UUID=$(echo "$PROFILE_PLIST" | /usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin)
          PROFILE_NAME=$(echo "$PROFILE_PLIST" | /usr/libexec/PlistBuddy -c "Print Name" /dev/stdin)
          cp $PROVISIONING_PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision

          WIDGET_PLIST=$(/usr/bin/security cms -D -i $WIDGET_PROFILE_PATH)
          WIDGET_UUID=$(echo "$WIDGET_PLIST" | /usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin)
          WIDGET_NAME=$(echo "$WIDGET_PLIST" | /usr/libexec/PlistBuddy -c "Print Name" /dev/stdin)
          cp $WIDGET_PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$WIDGET_UUID.mobileprovision

          echo "PROVISIONING_PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_OUTPUT
          echo "PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_OUTPUT
          echo "WIDGET_PROFILE_UUID=$WIDGET_UUID" >> $GITHUB_OUTPUT
          echo "WIDGET_PROFILE_NAME=$WIDGET_NAME" >> $GITHUB_OUTPUT

          echo "Installed provisioning profiles:"
          echo "  App  - UUID: $PROFILE_UUID, Name: $PROFILE_NAME"
          echo "  Widget - UUID: $WIDGET_UUID, Name: $WIDGET_NAME"
          echo ""
          echo "Installed profiles:"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          echo ""
          echo "Keychain certificates:"
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Build Flutter iOS
        id: build-metadata
        env:
          PAID_SUBSCRIPTIONS_ENABLED: ${{ vars.PAID_SUBSCRIPTIONS_ENABLED_DEV || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_DEV }}
          REVENUECAT_PUBLIC_KEY: ${{ secrets.REVENUECAT_PUBLIC_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          cd app
          BUILD_NAME=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+)\+.*/\1/')
          BUILD_NUMBER=$(( (${{ github.run_number }} + 135) * 100 + ${{ github.run_attempt }} ))
          echo "marketing-version=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "build-number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          flutter build ios \
            --flavor dev \
            -t lib/main_dev.dart \
            --release \
            --no-codesign \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=PAID_SUBSCRIPTIONS_ENABLED="$PAID_SUBSCRIPTIONS_ENABLED" \
            --dart-define=ENVIRONMENT=development \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=REVENUECAT_PUBLIC_KEY="$REVENUECAT_PUBLIC_KEY" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Build and Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          PROVISIONING_PROFILE_NAME: ${{ steps.install-cert.outputs.PROVISIONING_PROFILE_NAME }}
          WIDGET_PROFILE_NAME: ${{ steps.install-cert.outputs.WIDGET_PROFILE_NAME }}
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          cd app/ios
          bundle exec fastlane beta

      - name: Verify TestFlight build processing
        timeout-minutes: 35
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          TESTFLIGHT_APP_IDENTIFIER: com.bookgolas.app.dev
          TESTFLIGHT_MARKETING_VERSION: ${{ steps.build-metadata.outputs.marketing-version }}
          TESTFLIGHT_BUILD_NUMBER: ${{ steps.build-metadata.outputs.build-number }}
        run: |
          cd app/ios
          bundle exec ruby fastlane/scripts/verify_testflight_build.rb

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

  verify-existing-build:
    name: Verify Existing TestFlight Build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'verify' }}
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby (Homebrew)
        run: |
          echo "/opt/homebrew/opt/ruby/bin" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/opt/ruby/bin:$PATH"
          ruby -v
          gem list bundler

      - name: Install Ruby dependencies
        run: |
          cd app/ios
          bundle config set --local path vendor/bundle
          bundle install

      - name: Test App Store Connect build verification
        run: ruby app/ios/fastlane/test/testflight_build_verifier_test.rb

      - name: Verify TestFlight build processing
        timeout-minutes: 35
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          TESTFLIGHT_APP_IDENTIFIER: com.bookgolas.app.dev
          TESTFLIGHT_MARKETING_VERSION: ${{ inputs.marketing_version }}
          TESTFLIGHT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          cd app/ios
          bundle exec ruby fastlane/scripts/verify_testflight_build.rb
