name: iOS TestFlight Deploy

on:
  push:
    branches:
      - dev
    # web 전용 / 문서 전용 변경 시 iOS 빌드 트리거 안 함
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

jobs:
  migrate-database:
    name: Apply Database Migrations (Dev)
    runs-on: self-hosted
    # Dev DB 마이그레이션 히스토리가 로컬과 맞지 않아 실패하더라도 iOS 빌드는 막지 않음
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Dev Project
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Repair migration history (orphan remote migrations)
        run: |
          echo "Marking orphan remote migrations as reverted (idempotent)..."
          supabase migration repair --status reverted 20260419123526 20260419130933 || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply Migrations
        run: |
          echo "Applying migrations to Dev database..."
          supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions (Dev)
        if: always()
        run: |
          echo "Deploying Edge Functions to Dev..."
          for fn in supabase/functions/*/; do
            fn_name=$(basename "$fn")
            [ ! -f "$fn/index.ts" ] && echo "  Skipping: $fn_name (no index.ts)" && continue
            echo "  Deploying: $fn_name"
            supabase functions deploy "$fn_name"
          done
          echo "✅ All Edge Functions deployed"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify Migration Status
        run: |
          echo "Checking migration status..."
          supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  build-and-deploy:
    # needs: migrate-database  # Temporarily disabled due to migration history mismatch
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE_26_PATH=""
          XCODE_26_WITH_IOS_SDK_PATH=""

          echo "Available Xcode installations:"
          for candidate in /Applications/Xcode*.app; do
            [ -d "$candidate" ] || continue
            version=$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | head -n 1 || true)
            sdks=$(DEVELOPER_DIR="$candidate/Contents/Developer" "$candidate/Contents/Developer/usr/bin/xcodebuild" -showsdks 2>/dev/null || true)
            echo "- $candidate: $version"
            echo "$sdks" | grep -E 'iphoneos|iOS SDK' || true

            if echo "$version" | grep -q '^Xcode 26'; then
              [ -z "$XCODE_26_PATH" ] && XCODE_26_PATH="$candidate"
              if echo "$sdks" | grep -q 'iphoneos26'; then
                XCODE_26_WITH_IOS_SDK_PATH="$candidate"
                break
              fi
            fi
          done

          if [ -z "$XCODE_26_PATH" ]; then
            echo "::error::Xcode 26+ is required for App Store Connect/TestFlight uploads. Install/select Xcode 26+ on the runner."
            xcodebuild -version || true
            exit 1
          fi

          if [ -z "$XCODE_26_WITH_IOS_SDK_PATH" ]; then
            echo "iOS 26 SDK is missing from the first Xcode 26 candidates. Attempting to install the iOS platform..."
            DEVELOPER_DIR="$XCODE_26_PATH/Contents/Developer" xcodebuild -downloadPlatform iOS || true
            if DEVELOPER_DIR="$XCODE_26_PATH/Contents/Developer" xcodebuild -showsdks | grep -q 'iphoneos26'; then
              XCODE_26_WITH_IOS_SDK_PATH="$XCODE_26_PATH"
            fi
          fi

          if [ -z "$XCODE_26_WITH_IOS_SDK_PATH" ]; then
            echo "::error::Xcode 26+ was found, but no installation has the iOS 26 SDK required for device builds."
            exit 1
          fi

          echo "DEVELOPER_DIR=$XCODE_26_WITH_IOS_SDK_PATH/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE_26_WITH_IOS_SDK_PATH/Contents/Developer" xcodebuild -version
          DEVELOPER_DIR="$XCODE_26_WITH_IOS_SDK_PATH/Contents/Developer" xcodebuild -showsdks | grep iphoneos

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'
          cache: true

      - name: Setup Ruby (Homebrew)
        run: |
          echo "/opt/homebrew/opt/ruby/bin" >> $GITHUB_PATH
          export PATH="/opt/homebrew/opt/ruby/bin:$PATH"
          ruby -v
          gem list bundler

      - name: Install Ruby dependencies
        run: |
          cd app/ios
          bundle config set --local path vendor/bundle
          bundle install

      - name: Flutter pub get
        run: |
          cd app
          flutter pub get

      - name: Install CocoaPods
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          cd app/ios
          bundle exec pod install --repo-update

      - name: Create .env file
        run: |
          cd app
          echo "ALADIN_TTB_KEY=${{ secrets.ALADIN_TTB_KEY }}" >> .env
          echo "SUPABASE_URL_DEV=${{ secrets.SUPABASE_URL_DEV }}" >> .env
          echo "SUPABASE_ANON_KEY_DEV=${{ secrets.SUPABASE_ANON_KEY_DEV }}" >> .env
          echo "GOOGLE_CLOUD_VISION_API_KEY=${{ secrets.GOOGLE_CLOUD_VISION_API_KEY }}" >> .env
          echo "REVENUECAT_PUBLIC_KEY=${{ secrets.REVENUECAT_PUBLIC_KEY }}" >> .env
          echo "ENVIRONMENT=development" >> .env

      - name: Install Certificate and Provisioning Profiles
        id: install-cert
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_DEV_BASE64 }}
          PROVISIONING_PROFILE_WIDGET_BASE64: ${{ secrets.PROVISIONING_PROFILE_WIDGET_DEV_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          PROVISIONING_PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          WIDGET_PROFILE_PATH=$RUNNER_TEMP/widget_profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode > $PROVISIONING_PROFILE_PATH
          echo -n "$PROVISIONING_PROFILE_WIDGET_BASE64" | base64 --decode > $WIDGET_PROFILE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain-db

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          PROFILE_PLIST=$(/usr/bin/security cms -D -i $PROVISIONING_PROFILE_PATH)
          PROFILE_UUID=$(echo "$PROFILE_PLIST" | /usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin)
          PROFILE_NAME=$(echo "$PROFILE_PLIST" | /usr/libexec/PlistBuddy -c "Print Name" /dev/stdin)
          cp $PROVISIONING_PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision

          WIDGET_PLIST=$(/usr/bin/security cms -D -i $WIDGET_PROFILE_PATH)
          WIDGET_UUID=$(echo "$WIDGET_PLIST" | /usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin)
          WIDGET_NAME=$(echo "$WIDGET_PLIST" | /usr/libexec/PlistBuddy -c "Print Name" /dev/stdin)
          cp $WIDGET_PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$WIDGET_UUID.mobileprovision

          echo "PROVISIONING_PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_OUTPUT
          echo "PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_OUTPUT
          echo "WIDGET_PROFILE_UUID=$WIDGET_UUID" >> $GITHUB_OUTPUT
          echo "WIDGET_PROFILE_NAME=$WIDGET_NAME" >> $GITHUB_OUTPUT

          echo "Installed provisioning profiles:"
          echo "  App  - UUID: $PROFILE_UUID, Name: $PROFILE_NAME"
          echo "  Widget - UUID: $WIDGET_UUID, Name: $WIDGET_NAME"
          echo ""
          echo "Installed profiles:"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          echo ""
          echo "Keychain certificates:"
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Build Flutter iOS
        run: |
          cd app
          BUILD_NAME=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+)\+.*/\1/')
          BUILD_NUMBER=$(( (${{ github.run_number }} + 135) * 100 + ${{ github.run_attempt }} ))
          flutter build ios --flavor dev -t lib/main_dev.dart --release --no-codesign --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER

      - name: Build and Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          PROVISIONING_PROFILE_NAME: ${{ steps.install-cert.outputs.PROVISIONING_PROFILE_NAME }}
          WIDGET_PROFILE_NAME: ${{ steps.install-cert.outputs.WIDGET_PROFILE_NAME }}
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          cd app/ios
          bundle exec fastlane beta

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
