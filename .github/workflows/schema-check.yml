name: Schema Validation

on:
  pull_request:
    branches:
      - main
      - dev
      - 'version/**'
      - 'release/**'
    paths:
      - '.github/workflows/schema-check.yml'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/tests/**'

jobs:
  check-migrations:
    name: Validate Database Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check migration file naming
        run: |
          echo "Checking migration file naming conventions..."
          
          MIGRATION_DIR="supabase/migrations"
          ERRORS=0
          
          if [ -d "$MIGRATION_DIR" ]; then
            for file in "$MIGRATION_DIR"/*.sql; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                
                if ! [[ $filename =~ ^[0-9]{8}([0-9]{6})?_[a-z0-9_]+\.sql$ ]]; then
                  echo "::error file=$file::Invalid migration filename: $filename"
                  echo "  Expected format: YYYYMMDD_description.sql or YYYYMMDDHHMMSS_description.sql (lowercase, underscores)"
                  ERRORS=$((ERRORS + 1))
                fi
              fi
            done
          fi
          
          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "::error::Found $ERRORS migration file(s) with invalid naming"
            exit 1
          fi
          
          echo "All migration files follow naming conventions"

      - name: Run migration safety fixtures
        run: python3 -m unittest discover -s supabase/tests -p 'test_validate_migrations.py' -v

      - name: Check for new migrations in PR
        id: check-new-migrations
        run: |
          echo "Checking for new migration files in this PR..."
          
          NEW_MIGRATIONS=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- 'supabase/migrations/*.sql' || true)
          
          if [ -n "$NEW_MIGRATIONS" ]; then
            echo "new_migrations=true" >> $GITHUB_OUTPUT
            echo "::notice::New migrations detected:"
            echo "$NEW_MIGRATIONS"
            
            echo "### New Migrations" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$NEW_MIGRATIONS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "new_migrations=false" >> $GITHUB_OUTPUT
            echo "No new migrations in this PR"
          fi

      - name: Migration safety warning
        if: steps.check-new-migrations.outputs.new_migrations == 'true'
        run: |
          echo "::warning::This PR contains database migrations!"
          echo ""
          echo "IMPORTANT: Before merging, ensure:"
          echo "1. The local migration validation passed"
          echo "2. The PR checklist in the description is complete"
          echo "3. Rollback SQL is prepared if needed"
          echo ""
          
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          
          ## ⚠️ Database Migration Warning
          
          This PR contains database schema changes. **Before merging:**
          
          | Check | Status |
          |-------|--------|
          | Local migration validation | ☐ |
          | Dev deployment after `dev` merge | ☐ |
          | Production deployment after `main` merge | ☐ |
          | Rollback SQL prepared | ☐ |
          | Data migration plan (if needed) | ☐ |
          
          ### Supabase Project References
          - **Dev**: `reoiqefoymdsqzpbouxi`
          - **Prod**: `enyxrgxixrnoazzgqyyd`
          
          EOF

      - name: Block dangerous operations (CRITICAL)
        if: steps.check-new-migrations.outputs.new_migrations == 'true'
        run: |
          NEW_MIGRATIONS=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- 'supabase/migrations/*.sql' || true)
          python3 supabase/tests/validate_migrations.py $NEW_MIGRATIONS

      - name: Start local database
        run: supabase db start

      - name: Apply all migrations locally
        run: supabase db reset --local --no-seed

      - name: Test local database policies
        run: supabase test db

      - name: Lint local schema
        run: supabase db lint --local --level error

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup || true

  check-edge-functions:
    name: Validate Edge Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new Edge Functions in PR
        id: check-functions
        run: |
          NEW_FUNCTIONS=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- 'supabase/functions/**' || true)
          
          if [ -n "$NEW_FUNCTIONS" ]; then
            echo "new_functions=true" >> $GITHUB_OUTPUT
            echo "::notice::Edge Function changes detected:"
            echo "$NEW_FUNCTIONS"
            
            echo "### Edge Function Changes" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$NEW_FUNCTIONS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "new_functions=false" >> $GITHUB_OUTPUT
          fi

      - name: Edge Function deployment warning
        if: steps.check-functions.outputs.new_functions == 'true'
        run: |
          echo "::warning::This PR contains Edge Function changes!"
          echo ""
          echo "Edge Functions deploy through the dev and main release workflows."
          echo ""
          
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          
          ## ⚠️ Edge Function Changes
          
          Functions deploy to development after merge to `dev` and to production
          only after merge to `main` through the release workflows.
          
          EOF
