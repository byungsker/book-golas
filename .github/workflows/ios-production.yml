name: iOS App Store Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'supabase/**'
  workflow_dispatch:

jobs:
  migrate-database:
    name: Apply Database Migrations (Production)
    runs-on: self-hosted
    environment:
      name: production
      # GitHub Settings → Environments → production에서:
      # - Required reviewers 설정 (배포 전 수동 승인)
      # - Deployment branches: main only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Link to Production Project
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Reconcile legacy production migration history
        run: |
          echo "Reconciling legacy waitlist migration versions..."
          supabase migration repair --status reverted 20260419123544 20260419130941 || \
            echo "::warning::Migration repair returned a non-zero status; verifying the remote history."
          migration_status="$(supabase migration list)"
          echo "$migration_status"
          if echo "$migration_status" | grep -Eq '20260419123544|20260419130941'; then
            echo "::error::Legacy production migration versions remain in the remote history."
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply Migrations
        run: |
          echo "Applying migrations to Production database..."
          echo "::warning::Production database migration in progress!"
          supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify Migration Status
        run: |
          echo "Checking migration status..."
          supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy-edge-functions:
    needs: migrate-database
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test third-party AI provider boundaries
        run: |
          deno test --frozen --config supabase/functions/deno.json --allow-env --allow-net \
            supabase/functions/_shared/third-party-ai-consent.test.ts \
            supabase/functions/_shared/ai-usage.test.ts \
            supabase/functions/recommend-next-books/services/profile-collector.test.ts \
            supabase/functions/vision-ocr/index_test.ts
          deno test --frozen --config supabase/functions/structure-notes/deno.json --allow-env --allow-net \
            supabase/functions/structure-notes/services/chain-service.test.ts

      - name: Deploy consent-gated Edge Functions to Production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
        run: |
          for function_name in \
            extract-keywords \
            generate-book-review \
            generate-embedding \
            reading-insights \
            recall-search \
            recommend-next-books \
            structure-notes \
            vision-ocr; do
            supabase/functions/deploy-with-retry.sh "$function_name" \
              --project-ref "$SUPABASE_PROJECT_REF"
          done

  build-and-deploy:
    needs: deploy-edge-functions
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Xcode 26 toolchain
        run: |
          DEVELOPER_PATH="/Applications/Xcode.app/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_PATH" >> "$GITHUB_ENV"
          sudo xcode-select -s "$DEVELOPER_PATH"

          XCODE_VERSION=$(xcodebuild -version | sed -n '1p')
          if ! echo "$XCODE_VERSION" | grep -q '^Xcode 26'; then
            echo "::error::Xcode 26+ is required for App Store Connect uploads. Found: $XCODE_VERSION"
            exit 1
          fi

          IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          IOS_SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          if ! echo "$IOS_SDK_VERSION" | grep -q '^26\.'; then
            echo "::error::The iOS 26 device SDK is required. Found: $IOS_SDK_VERSION"
            exit 1
          fi

          for header in \
            "$IOS_SDK_PATH/usr/include/sys/_types/_ssize_t.h" \
            "$IOS_SDK_PATH/usr/include/_modules/_darwin_c_stdio.h"; do
            if [ ! -f "$header" ]; then
              echo "::error::The selected iOS device SDK is incomplete: $header is missing."
              exit 1
            fi
          done

          xcodebuild -version
          echo "iOS device SDK: $IOS_SDK_VERSION ($IOS_SDK_PATH)"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'
          cache: true

      - name: Setup Ruby (Homebrew)
        run: |
          echo "/opt/homebrew/opt/ruby/bin" >> $GITHUB_PATH
          export PATH="/opt/homebrew/opt/ruby/bin:$PATH"
          ruby -v
          gem list bundler

      - name: Install Ruby dependencies
        run: |
          cd app/ios
          bundle config set --local path vendor/bundle
          bundle install

      - name: Test App Store Connect build verification
        run: ruby app/ios/fastlane/test/testflight_build_verifier_test.rb

      - name: Flutter pub get
        run: |
          cd app
          flutter pub get

      - name: Verify mobile client configuration inputs
        run: python3 app/tool/verify_mobile_client_config.py --source-root app --workflow .github/workflows/ios-testflight.yml --workflow .github/workflows/ios-production.yml

      - name: Install CocoaPods
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          cd app/ios
          bundle exec pod install --repo-update

      - name: Install Certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode > $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain-db

          echo "Keychain certificates:"
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Build Flutter iOS inputs
        id: build-metadata
        env:
          ENVIRONMENT: production
          PAID_SUBSCRIPTIONS_ENABLED: ${{ vars.PAID_SUBSCRIPTIONS_ENABLED_PROD || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
          REVENUECAT_PUBLIC_KEY: ${{ secrets.REVENUECAT_PUBLIC_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          python3 app/tool/verify_mobile_client_config.py --require-client-environment
          cd app
          BUILD_NAME=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+)\+.*/\1/')
          BUILD_NUMBER=$(( (${{ github.run_number }} + 135) * 100 + ${{ github.run_attempt }} ))
          echo "marketing-version=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "build-number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          flutter build ios \
            --flavor prod \
            -t lib/main_prod.dart \
            --release \
            --no-codesign \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=PAID_SUBSCRIPTIONS_ENABLED="$PAID_SUBSCRIPTIONS_ENABLED" \
            --dart-define=ENVIRONMENT="$ENVIRONMENT" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=REVENUECAT_PUBLIC_KEY="$REVENUECAT_PUBLIC_KEY" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Build signed App Store IPA
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          cd app/ios
          bundle exec fastlane release_build

      - name: Verify signed App Store IPA boundary
        env:
          ALADIN_TTB_KEY: ${{ secrets.ALADIN_TTB_KEY }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_CLOUD_VISION_API_KEY: ${{ secrets.GOOGLE_CLOUD_VISION_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REVENUECAT_WEBHOOK_AUTH_KEY_PROD: ${{ secrets.REVENUECAT_WEBHOOK_AUTH_KEY_PROD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          /usr/bin/python3 app/tool/verify_mobile_client_config.py \
            --artifact app/ios/build/Runner.ipa \
            --required-forbidden-env APP_STORE_CONNECT_API_KEY_CONTENT \
            --required-forbidden-env CERTIFICATE_P12_BASE64 \
            --required-forbidden-env CERTIFICATE_PASSWORD \
            --optional-forbidden-env ALADIN_TTB_KEY \
            --optional-forbidden-env FIREBASE_SERVICE_ACCOUNT \
            --optional-forbidden-env GOOGLE_CLOUD_VISION_API_KEY \
            --optional-forbidden-env OPENAI_API_KEY \
            --optional-forbidden-env RESEND_API_KEY \
            --optional-forbidden-env REVENUECAT_WEBHOOK_AUTH_KEY_PROD \
            --optional-forbidden-env SUPABASE_SERVICE_ROLE_KEY

      - name: Upload scanned App Store IPA
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          cd app/ios
          bundle exec fastlane release_upload

      - name: Verify App Store Connect build processing
        timeout-minutes: 35
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          TESTFLIGHT_APP_IDENTIFIER: com.bookgolas.app
          TESTFLIGHT_MARKETING_VERSION: ${{ steps.build-metadata.outputs.marketing-version }}
          TESTFLIGHT_BUILD_NUMBER: ${{ steps.build-metadata.outputs.build-number }}
        run: |
          cd app/ios
          bundle exec ruby fastlane/scripts/verify_testflight_build.rb

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
