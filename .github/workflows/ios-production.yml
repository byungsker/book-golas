name: iOS App Store Deploy

on:
  push:
    branches:
      - main
    # web 전용 / 문서 전용 변경 시 iOS 빌드 트리거 안 함
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

jobs:
  migrate-database:
    name: Apply Database Migrations (Production)
    runs-on: self-hosted
    environment:
      name: production
      # GitHub Settings → Environments → production에서:
      # - Required reviewers 설정 (배포 전 수동 승인)
      # - Deployment branches: main only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Link to Production Project
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Configure Edge Function Secrets
        run: |
          test -n "$REVENUECAT_WEBHOOK_AUTH_KEY"
          test -n "$ALADIN_TTB_KEY"
          test -n "$GOOGLE_CLOUD_VISION_API_KEY"
          supabase secrets set \
            REVENUECAT_WEBHOOK_AUTH_KEY="$REVENUECAT_WEBHOOK_AUTH_KEY" \
            ALADIN_TTB_KEY="$ALADIN_TTB_KEY" \
            GOOGLE_CLOUD_VISION_API_KEY="$GOOGLE_CLOUD_VISION_API_KEY"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REVENUECAT_WEBHOOK_AUTH_KEY: ${{ secrets.REVENUECAT_WEBHOOK_AUTH_KEY_PROD }}
          ALADIN_TTB_KEY: ${{ secrets.ALADIN_TTB_KEY }}
          GOOGLE_CLOUD_VISION_API_KEY: ${{ secrets.GOOGLE_CLOUD_VISION_API_KEY }}

      - name: Reconcile legacy production migration history
        run: |
          echo "Reconciling legacy waitlist migration versions..."
          supabase migration repair --status reverted 20260419123544 20260419130941 || \
            echo "::warning::Migration repair returned a non-zero status; verifying the remote history."
          migration_status="$(supabase migration list)"
          echo "$migration_status"
          if echo "$migration_status" | grep -Eq '20260419123544|20260419130941'; then
            echo "::error::Legacy production migration versions remain in the remote history."
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply Migrations
        run: |
          echo "Applying migrations to Production database..."
          echo "::warning::Production database migration in progress!"
          supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions (Production)
        run: |
          echo "Deploying Edge Functions to Production..."
          for fn in supabase/functions/*/; do
            fn_name=$(basename "$fn")
            [ ! -f "$fn/index.ts" ] && echo "  Skipping: $fn_name (no index.ts)" && continue
            echo "  Deploying: $fn_name"
            supabase functions deploy "$fn_name"
          done
          echo "✅ All Edge Functions deployed"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify Migration Status
        run: |
          echo "Checking migration status..."
          supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  build-and-deploy:
    needs: migrate-database
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE_26_PATH=""
          XCODE_26_WITH_IOS_SDK_PATH=""

          echo "Available Xcode installations:"
          for candidate in /Applications/Xcode*.app; do
            [ -d "$candidate" ] || continue
            version=$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | sed -n '1p' || true)
            sdks=$(DEVELOPER_DIR="$candidate/Contents/Developer" "$candidate/Contents/Developer/usr/bin/xcodebuild" -showsdks 2>/dev/null || true)
            echo "- $candidate: $version"
            echo "$sdks" | grep -E 'iphoneos|iOS SDK' || true

            if echo "$version" | grep -q '^Xcode 26'; then
              [ -z "$XCODE_26_PATH" ] && XCODE_26_PATH="$candidate"
              if echo "$sdks" | grep -q 'iphoneos26'; then
                XCODE_26_WITH_IOS_SDK_PATH="$candidate"
                break
              fi
            fi
          done

          if [ -z "$XCODE_26_PATH" ]; then
            echo "::error::Xcode 26+ is required for App Store Connect uploads. Install/select Xcode 26+ on the runner."
            xcodebuild -version || true
            exit 1
          fi

          if [ -z "$XCODE_26_WITH_IOS_SDK_PATH" ]; then
            echo "iOS 26 SDK is missing from the first Xcode 26 candidates. Attempting to install the iOS platform..."
            DEVELOPER_DIR="$XCODE_26_PATH/Contents/Developer" xcodebuild -downloadPlatform iOS || true
            if DEVELOPER_DIR="$XCODE_26_PATH/Contents/Developer" xcodebuild -showsdks | grep -q 'iphoneos26'; then
              XCODE_26_WITH_IOS_SDK_PATH="$XCODE_26_PATH"
            fi
          fi

          if [ -z "$XCODE_26_WITH_IOS_SDK_PATH" ]; then
            echo "::error::Xcode 26+ was found, but no installation has the iOS 26 SDK required for device builds."
            exit 1
          fi

          echo "DEVELOPER_DIR=$XCODE_26_WITH_IOS_SDK_PATH/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XCODE_26_WITH_IOS_SDK_PATH/Contents/Developer"
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -downloadPlatform iOS || true
          xcodebuild -showsdks | grep iphoneos

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'
          cache: true

      - name: Setup Ruby (Homebrew)
        run: |
          echo "/opt/homebrew/opt/ruby/bin" >> $GITHUB_PATH
          export PATH="/opt/homebrew/opt/ruby/bin:$PATH"
          ruby -v
          gem list bundler

      - name: Install Ruby dependencies
        run: |
          cd app/ios
          bundle config set --local path vendor/bundle
          bundle install

      - name: Flutter pub get
        run: |
          cd app
          flutter pub get

      - name: Install CocoaPods
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          cd app/ios
          bundle exec pod install --repo-update

      - name: Install Certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode > $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain-db

          echo "Keychain certificates:"
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Build Flutter iOS
        env:
          PAID_SUBSCRIPTIONS_ENABLED: ${{ vars.PAID_SUBSCRIPTIONS_ENABLED_PROD || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
          REVENUECAT_PUBLIC_KEY: ${{ secrets.REVENUECAT_PUBLIC_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          cd app
          BUILD_NAME=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9]+\.[0-9]+\.[0-9]+)\+.*/\1/')
          BUILD_NUMBER=$(( (${{ github.run_number }} + 135) * 100 + ${{ github.run_attempt }} ))
          flutter build ios \
            --flavor prod \
            -t lib/main_prod.dart \
            --release \
            --no-codesign \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=PAID_SUBSCRIPTIONS_ENABLED="$PAID_SUBSCRIPTIONS_ENABLED" \
            --dart-define=ENVIRONMENT=production \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=REVENUECAT_PUBLIC_KEY="$REVENUECAT_PUBLIC_KEY" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Build and Upload to App Store
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          cd app/ios
          bundle exec fastlane release

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
