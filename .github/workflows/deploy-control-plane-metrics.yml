name: Deploy Control Plane Metrics

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    name: Deploy aggregate metrics endpoint (${{ inputs.target }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'prod' && 'Production' || 'Preview' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Link target project
        run: |
          if [ "$TARGET" = "prod" ]; then
            supabase link --project-ref "$SUPABASE_PROJECT_REF_PROD"
          else
            supabase link --project-ref "$SUPABASE_PROJECT_REF_DEV"
          fi
        env:
          TARGET: ${{ inputs.target }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF_DEV: ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
          SUPABASE_PROJECT_REF_PROD: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}

      - name: Apply database migrations
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Configure endpoint secret
        run: |
          if [ "$TARGET" = "prod" ]; then
            token="$CONTROL_PLANE_METRICS_TOKEN_PROD"
            environment="production"
          else
            token="$CONTROL_PLANE_METRICS_TOKEN_DEV"
            environment="development"
          fi

          test -n "$token"
          test "${#token}" -ge 32
          supabase secrets set \
            CONTROL_PLANE_METRICS_TOKEN="$token" \
            CONTROL_PLANE_ENVIRONMENT="$environment"
        env:
          TARGET: ${{ inputs.target }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CONTROL_PLANE_METRICS_TOKEN_DEV: ${{ secrets.CONTROL_PLANE_METRICS_TOKEN_DEV }}
          CONTROL_PLANE_METRICS_TOKEN_PROD: ${{ secrets.CONTROL_PLANE_METRICS_TOKEN_PROD }}

      - name: Deploy endpoint
        run: supabase functions deploy control-plane-metrics
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify fail-closed endpoint contract
        run: |
          if [ "$TARGET" = "prod" ]; then
            endpoint="https://${SUPABASE_PROJECT_REF_PROD}.supabase.co/functions/v1/control-plane-metrics"
            token="$CONTROL_PLANE_METRICS_TOKEN_PROD"
          else
            endpoint="https://${SUPABASE_PROJECT_REF_DEV}.supabase.co/functions/v1/control-plane-metrics"
            token="$CONTROL_PLANE_METRICS_TOKEN_DEV"
          fi

          response_file="$RUNNER_TEMP/control-plane-metrics.json"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            -H "Authorization: Bearer $token" "$endpoint")"
          test "$status" = 200
          jq -e '
            .schema_version == 1 and
            .product_id == "bookgolas" and
            .admin.scope == "aggregate_metrics_only" and
            (.analytics.metrics | type == "object") and
            (has("user_id") | not) and
            (has("email") | not)
          ' "$response_file" >/dev/null

          invalid_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H 'Authorization: Bearer invalid-control-plane-token' "$endpoint")"
          test "$invalid_status" = 401
        env:
          TARGET: ${{ inputs.target }}
          SUPABASE_PROJECT_REF_DEV: ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
          SUPABASE_PROJECT_REF_PROD: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
          CONTROL_PLANE_METRICS_TOKEN_DEV: ${{ secrets.CONTROL_PLANE_METRICS_TOKEN_DEV }}
          CONTROL_PLANE_METRICS_TOKEN_PROD: ${{ secrets.CONTROL_PLANE_METRICS_TOKEN_PROD }}
